# /etc/nginx/sites-available/soireematch.conf
# Adapte si besoin, puis :
#   ln -s /etc/nginx/sites-available/soireematch.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
# Certbot ajoutera automatiquement le bloc 443 (HTTPS).

server {
    listen 80;
    listen [::]:80;
    server_name soireematch.com www.soireematch.com;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
